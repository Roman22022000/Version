<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Version — Photo Grid</title>

  <style>
    :root {
      --bg: #121212;
      --text: #e0e0e0;
      --muted: #9a9a9a;
      --gap: 18px;
      --tile-radius: 0px;
      --overlay: rgba(0, 0, 0, 0.62);
      --arrow-bg: rgba(255, 255, 255, 0.12);
      --arrow-border: rgba(255, 255, 255, 0.30);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 36px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-header h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .page-header p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* =========================================
       СЕТКА 3 x 4
       3 строки / 4 колонки
       ========================================= */

    .photo-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(180px, 1fr));
      gap: var(--gap);
    }

    /* =========================================
       ОТДЕЛЬНАЯ ПЛИТКА
       ========================================= */

    .photo-tile {
      position: relative;
      min-width: 0;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #1b1b1b;
      border-radius: var(--tile-radius);
      isolation: isolate;
    }

    .photo-tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 1;
      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .photo-tile:hover img {
      transform: scale(1.015);
    }

    /* =========================================
       БОКОВЫЕ ЗАТЕМНЕНИЯ
       Появляются только при наведении
       ========================================= */

    .tile-side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 24%;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .tile-side-left {
      left: 0;
      background:
        linear-gradient(
          to right,
          var(--overlay),
          rgba(0, 0, 0, 0)
        );
    }

    .tile-side-right {
      right: 0;
      background:
        linear-gradient(
          to left,
          var(--overlay),
          rgba(0, 0, 0, 0)
        );
    }

    .photo-tile:hover .tile-side {
      opacity: 1;
    }

    /* =========================================
       СТРЕЛКИ
       ========================================= */

    .tile-arrow {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 48px;
      height: 48px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--arrow-border);
      border-radius: 50%;
      background: var(--arrow-bg);
      color: #ffffff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .tile-arrow-left {
      left: 14px;
    }

    .tile-arrow-right {
      right: 14px;
    }

    .photo-tile:hover .tile-arrow {
      opacity: 1;
      pointer-events: auto;
    }

    .tile-arrow:hover {
      background: rgba(255, 255, 255, 0.24);
      border-color: rgba(255, 255, 255, 0.75);
    }

    .tile-arrow-left:hover {
      transform: translateY(-50%) scale(1.08);
    }

    .tile-arrow-right:hover {
      transform: translateY(-50%) scale(1.08);
    }

    .tile-arrow:active {
      transform: translateY(-50%) scale(0.94);
    }

    /* =========================================
       НОМЕР ПЛИТКИ
       ========================================= */

    .tile-number {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 6;
      padding: 4px 7px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .photo-tile:hover .tile-number {
      opacity: 1;
    }

    /* =========================================
       АДАПТАЦИЯ
       ========================================= */

    @media (max-width: 900px) {
      .page {
        padding: 22px;
      }

      .photo-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: none;
      }
    }

    @media (max-width: 650px) {
      .page {
        padding: 14px;
      }

      .page-header {
        margin-bottom: 20px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .tile-arrow {
        width: 38px;
        height: 38px;
        font-size: 21px;
      }

      .tile-arrow-left {
        left: 8px;
      }

      .tile-arrow-right {
        right: 8px;
      }
    }

    @media (max-width: 420px) {
      .photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

    </header>

    <!-- =========================================

      <article class="photo-tile" data-tile="8">

  <script>
    /* =========================================
       ФОТОГРАФИИ ДЛЯ 12 ПЛИТОК
       =========================================

       Каждая плитка имеет собственный массив.
       Можно добавлять любое количество фотографий.

       Пример:
       "photos/tile01-01.jpg",
       "photos/tile01-02.jpg",
       "photos/tile01-03.jpg"

       Все фотографии должны находиться
       в папке "photos".
       ========================================= */

    const tilePhotos = [

      /* ПЛИТКА 01 */
      [
        "photos/tile01-01.jpg",
        "photos/tile01-02.jpg",
        "photos/tile01-03.jpg"
      ],

      /* ПЛИТКА 02 */
      [
        "photos/tile02-01.jpg",
        "photos/tile02-02.jpg",
        "photos/tile02-03.jpg"
      ],

      /* ПЛИТКА 03 */
      [
        "photos/tile03-01.jpg",
        "photos/tile03-02.jpg",
        "photos/tile03-03.jpg"
      ],

      /* ПЛИТКА 04 */
      [
        "photos/tile04-01.jpg",
        "photos/tile04-02.jpg",
        "photos/tile04-03.jpg"
      ],

      /* ПЛИТКА 05 */
      [
        "photos/tile05-01.jpg",
        "photos/tile05-02.jpg",
        "photos/tile05-03.jpg"
      ],

      /* ПЛИТКА 06 */
      [
        "photos/tile06-01.jpg",
        "photos/tile06-02.jpg",
        "photos/tile06-03.jpg"
      ],

      /* ПЛИТКА 07 */
      [
        "photos/tile07-01.jpg",
        "photos/tile07-02.jpg",
        "photos/tile07-03.jpg"
      ],

      /* ПЛИТКА 08 */
      [
        "photos/tile08-01.jpg",
        "photos/tile08-02.jpg",
        "photos/tile08-03.jpg"
      ],

      /* ПЛИТКА 09 */
      [
        "photos/tile09-01.jpg",
        "photos/tile09-02.jpg",
        "photos/tile09-03.jpg"
      ],

      /* ПЛИТКА 10 */
      [
        "photos/tile10-01.jpg",
        "photos/tile10-02.jpg",
        "photos/tile10-03.jpg"
      ],

      /* ПЛИТКА 11 */
      [
        "photos/tile11-01.jpg",
        "photos/tile11-02.jpg",
        "photos/tile11-03.jpg"
      ],

      /* ПЛИТКА 12 */
      [
        "photos/tile12-01.jpg",
        "photos/tile12-02.jpg",
        "photos/tile12-03.jpg"
      ]

    ];


    /* =========================================
       СОСТОЯНИЕ ПЛИТОК
       ========================================= */

    const tiles =
      document.querySelectorAll(".photo-tile");

    const currentIndexes =
      new Array(tiles.length).fill(0);


    /* =========================================
       ПОКАЗ ФОТОГРАФИИ
       ========================================= */

    function showTilePhoto(tileIndex, photoIndex) {

      const tile = tiles[tileIndex];

      if (!tile) {
        return;
      }

      const photos =
        tilePhotos[tileIndex];

      if (!photos || photos.length === 0) {
        return;
      }

      currentIndexes[tileIndex] =
        (photoIndex + photos.length) % photos.length;

      const image =
        tile.querySelector("img");

      image.style.opacity = "0";

      setTimeout(() => {

        image.src =
          photos[currentIndexes[tileIndex]];

        image.onload = () => {
          image.style.opacity = "1";
        };

        image.onerror = () => {
          image.style.opacity = "1";
          console.warn(
            "Не удалось загрузить:",
            image.src
          );
        };

      }, 120);
    }


    /* =========================================
       КНОПКИ НАЗАД / ВПЕРЁД
       ========================================= */

    tiles.forEach((tile, tileIndex) => {

      const previousButton =
        tile.querySelector(".tile-arrow-left");

      const nextButton =
        tile.querySelector(".tile-arrow-right");


      previousButton.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          showTilePhoto(
            tileIndex,
            currentIndexes[tileIndex] - 1
          );

        }
      );


      nextButton.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          showTilePhoto(
            tileIndex,
            currentIndexes[tileIndex] + 1
          );

        }
      );

    });


    /* =========================================
       АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
       =========================================

       НОВЫЙ КОД НАЧИНАЕТСЯ ЗДЕСЬ.

       Каждые 10 секунд ВСЕ 12 плиток
       одновременно переходят на следующую
       фотографию.

       10000 миллисекунд = 10 секунд.
       ========================================= */

    const AUTO_CHANGE_TIME = 10000;


    setInterval(() => {

      tiles.forEach((tile, tileIndex) => {

        showTilePhoto(
          tileIndex,
          currentIndexes[tileIndex] + 1
        );

      });

    }, AUTO_CHANGE_TIME);


    /* =========================================
       ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА
       ========================================= */

    tiles.forEach((tile, tileIndex) => {

      showTilePhoto(
        tileIndex,
        0
      );

    });
  </script>
